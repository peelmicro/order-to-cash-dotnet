# SonarQube scanner configuration — phase 21 (sonarqube_quality_gates, id 34).
# Ported from #7's order-to-cash-nestjs/sonar-project.properties; the
# architectural principle carries over unchanged — SonarQube itself is
# opt-in (`pnpm dc:up:sonar`, "sonar" compose profile,
# docker-compose.infra.yml) and never the enforced gate. `./quality.sh`'s
# own coverage-threshold check (section 5, merged coverlet cobertura
# reports, >=80% domain / >=60% overall) is the ENFORCED gate and works
# completely independently of SonarQube ever running — this file only
# configures what a scan WOULD analyse, and has no effect unless a scanner
# is actually pointed at a running SonarQube instance.
#
# NOT named sonar-project.properties, unlike #7's file — verified live
# (real scan, real SonarQube 26.8.0 container, `dotnet-sonarscanner end`):
# a file with that exact name anywhere under the repository root makes
# `dotnet-sonarscanner end` fail outright with "sonar-project.properties
# files are not understood by the SonarScanner for .NET. Remove those
# files from the following folders: <repo root>" — the .NET scanner does
# not merely ignore that filename (as it ignores sonar.sources/sonar.tests
# values, see below), it refuses to complete a scan while the file exists
# at all. Renaming to sonar-scan.properties (this file) let the same
# end-to-end scan finish with "ANALYSIS SUCCESSFUL" (progress/impl_
# sonarqube_quality_gates.md has the full transcript). This file was never
# auto-read by dotnet-sonarscanner regardless of name (see below), so the
# rename costs nothing functionally — it only avoids a name the .NET
# scanner actively rejects.
#
# What differs from #7, and why (both repositories implement the same
# spec, but the toolchains are not interchangeable):
#   - #7 is a single-ecosystem pnpm monorepo scanned by the plain
#     `sonar-scanner` CLI in one pass, which reads THIS EXACT FILE FORMAT
#     from the working directory by convention (sonar.sources=apps,
#     packages, etc. are honoured directly). #8's C# side needs the
#     MSBuild-aware "SonarScanner for .NET" instead (`dotnet-sonarscanner
#     begin` wraps the build, `... end` uploads) — a plain `sonar-scanner`
#     CLI run cannot analyse C# at all. Verified live (harmless dummy
#     token, no real server): `dotnet-sonarscanner begin /s:sonar-project.
#     properties` REJECTS this file outright ("Unable to read the analysis
#     settings file ... Please fix the content of this file" — it expects
#     an XML `SonarQube.Analysis.xml`, not this flat key=value format), and
#     even when the same sonar.sources/sonar.tests values are instead
#     passed as /d: flags on the command line, the scanner prints: "The
#     sonar.sources and sonar.tests properties are not supported by the
#     Scanner for .NET and are ignored. They are automatically computed
#     based on your repository." So on #8, THIS FILE IS DOCUMENTATION ONLY
#     for a human running a scan — package.json's `sonar:scan` passes the
#     properties that the .NET scanner DOES honour (sonar.exclusions,
#     sonar.cs.cobertura.reportsPaths) as /d: flags directly, and does not
#     pass sonar.sources/sonar.tests at all, since #7's own pattern of
#     "the file IS the config" does not transfer.
#   - #7's coverage import is `sonar.javascript.lcov.reportPaths` (every
#     vitest.config.mts workspace emits ['text', 'lcov']). #8's C# side
#     already produces Cobertura via coverlet.collector (the same
#     TestResults/**/coverage.cobertura.xml files ./quality.sh's own gate
#     merges), so `sonar.cs.cobertura.reportsPaths` below reuses that
#     output directly rather than adding a reporter nothing else needs.
#     apps/web/vitest.config.ts emits a 'cobertura' reporter too, but
#     SonarJS/TS coverage import wants LCOV, not Cobertura, and apps/web/
#     is out of this feature's touch list (CLAUDE.md "Cost discipline" —
#     LIGHT change, no apps/web source or config edits) — so apps/web is
#     still reachable for STATIC analysis (the .NET scanner walks the
#     whole repository tree, not just files referenced by a .csproj — the
#     exclusions below are what actually scopes it), but no coverage
#     number is imported for it. A future feature that touches apps/web/
#     vitest.config.ts to add an 'lcov' reporter can wire
#     sonar.javascript.lcov.reportPaths=apps/web/coverage/lcov.info then.

sonar.projectKey=order-to-cash-dotnet
sonar.projectName=Order To Cash (.NET)
sonar.sourceEncoding=UTF-8

# sonar.sources / sonar.tests are DELIBERATELY OMITTED — SonarScanner for
# .NET ignores both (see above) and computes them from the repository tree
# itself. sonar.exclusions and sonar.test.inclusions below are the actual,
# honoured levers for scoping what gets analysed as source vs. test code.
sonar.test.inclusions=**/*.UnitTests/**/*.cs,**/*.IntegrationTests/**/*.cs,**/*.Tests/**/*.cs,**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

# bin/obj/TestResults never get a quality opinion (build output, not
# source); node_modules/.next/coverage mirror that on the web side.
# src/**/Infrastructure/Persistence/Migrations/** and *ModelSnapshot.cs are
# `dotnet ef migrations add` scaffolding — auto-generated, never
# hand-written, excluded from ./quality.sh's own coverage gate for the
# identical reason (see quality.sh section 5's comment) and excluded here
# so a scan does not report an opinion on code nobody wrote.
# apps/web/src/generated/** (OpenAPI-generated wire types) and
# apps/web/src/components/ui/** (shadcn-style generated UI primitives)
# mirror apps/web/vitest.config.ts's own coverage.exclude list exactly, for
# the same reason: generated code, not hand-written, not worth a rule.
sonar.exclusions=\
  **/bin/**,\
  **/obj/**,\
  **/TestResults/**,\
  src/**/Infrastructure/Persistence/Migrations/**,\
  **/*ModelSnapshot.cs,\
  **/node_modules/**,\
  apps/web/.next/**,\
  apps/web/coverage/**,\
  apps/web/test-results/**,\
  apps/web/src/generated/**,\
  apps/web/src/components/ui/**

# Mirrors the exclusions above for the coverage view specifically (a file
# can be scanned for issues but excluded from the coverage percentage —
# not needed here since the same generated code should carry neither an
# issue nor a coverage opinion, but declared explicitly rather than relying
# on sonar.exclusions alone, the same defensiveness #7's own file uses).
sonar.coverage.exclusions=\
  src/**/Infrastructure/Persistence/Migrations/**,\
  **/*ModelSnapshot.cs,\
  apps/web/src/generated/**,\
  apps/web/src/components/ui/**

# Every coverlet.collector run under ./quality.sh (`dotnet test
# OrderToCash.sln --collect:"XPlat Code Coverage" --results-directory
# ./TestResults`) already produces one coverage.cobertura.xml per test
# project under a GUID subdirectory — the same files quality.sh section 5
# merges for its own gate. Run `pnpm quality` (or `dotnet test` directly)
# before a scan so these exist; a scan against a stale or missing report
# does not fail, it silently reports 0% for whatever it cannot find, same
# caveat #7's own file documents for its lcov paths.
sonar.cs.cobertura.reportsPaths=TestResults/**/coverage.cobertura.xml

# sonar.host.url and the auth token are deliberately NOT set here — a
# token is a secret and a host URL varies by environment. Pass both on the
# scanner invocation instead (README.md "SonarQube" section, once written;
# until then see package.json's `sonar:scan` script, which gates on
# SONAR_TOKEN the same way #7's does):
#   export SONAR_TOKEN=squ_xxxxxxxx
#   pnpm run sonar:scan
